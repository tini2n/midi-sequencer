; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; U8g2 re-added in Phase 5 (OLED renderer)
; lib_deps = olikraus/U8g2@^2.36.12
build_src_filter = +<*> -<_legacy/>
build_flags =
    -std=gnu++17
    -DSEQUENCER_DEBUG
monitor_speed = 115200

[env:teensy41_encoder_test]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = 
    +<../test/encoder_test.cpp>
    +<io/>
    -<.git/>
    -<.svn/>
build_flags = 
    -std=gnu++17
monitor_speed = 115200

[env:teensy41_cursor_test]
platform = teensy
board = teensy41
framework = arduino
lib_deps = olikraus/U8g2@^2.36.12
build_src_filter = 
    +<../test/cursor_mode_test.cpp>
    +<core/>
    +<step/>
    +<io/>
    +<ui/>
    -<.git/>
    -<.svn/>
build_flags = 
    -std=gnu++17
monitor_speed = 115200